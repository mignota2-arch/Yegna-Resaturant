<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Yegna</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Yegna.</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact-container">
        <div class="contact-info">
            <h1>Get in Touch</h1>
            <p>Have a question about our digital ordering? Or want to host an event?</p>
            
            <div class="info-item">
                <strong>📍 Location:</strong>
                <p>gerjii, Addis Ababa, Ethiopia</p>
            </div>
            <div class="info-item">
                <strong>📞 Phone:</strong>
                <p>+251 911 231772</p>
            </div>

            <div class="social-follow" style="margin-top: 20px;">
                <h3>Follow us for exclusive discounts!</h3>
                <div class="social-icons" style="margin-top: 10px; font-size: 24px;">
                    <a href="#" target="_blank" style="margin-right: 15px; color: #1877F2;"><i class="fab fa-facebook"></i></a>
                    <a href="#" target="_blank" style="margin-right: 15px; color: #E1306C;"><i class="fab fa-instagram"></i></a>
                    <a href="#" target="_blank" style="margin-right: 15px; color: #0088cc;"><i class="fab fa-telegram"></i></a>
                    <a href="#" target="_blank" style="color: #000000;"><i class="fab fa-tiktok"></i></a>
                </div>
            </div>
            </div>

        <div class="contact-form-box">
            <form id="contactForm">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <textarea placeholder="Your Message" rows="5" required></textarea>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 Yegna Digital Restaurant.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

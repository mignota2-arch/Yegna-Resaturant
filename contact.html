            </div>            
            <div class="info-item">                
                <strong>📞 Phone:</strong>                
                <p>+251 911 231772</p>            
            </div>

            <div class="social-follow" style="margin-top: 20px;">                
                <h3>Follow us for exclusive discounts!</h3>                
                <div class="social-icons" style="margin-top: 10px; font-size: 24px;">                    
                    <!-- Facebook -->
                    <a href="https://web.facebook.com/profile.php?id=61590360661334" target="_blank" rel="noopener noreferrer" style="margin-right: 15px; color: #1877F2;"><i class="fab fa-facebook"></i></a>
